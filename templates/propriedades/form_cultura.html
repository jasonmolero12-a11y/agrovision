{% extends 'base_dashboard.html' %}
{% block title %}{{ titulo }} - AgroVision{% endblock %}
{% block titulo_pagina %}{{ titulo }}{% endblock %}
{% block conteudo %}
<div class="table-card" style="max-width: 700px;">
    <div class="table-header"><h3><i class="fas fa-leaf"></i> {{ titulo }}</h3></div>
    <div style="padding: 24px;">
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div style="margin-bottom: 16px;"><label style="font-weight:600;">Nome *</label><input type="text" name="nome" required style="width:100%; padding:10px 14px; border:2px solid #E0E0E0; border-radius:8px;"></div>
            <div style="margin-bottom: 16px;"><label style="font-weight:600;">Ciclo</label><input type="text" name="ciclo" placeholder="Ex: Anual, Semestral" style="width:100%; padding:10px 14px; border:2px solid #E0E0E0; border-radius:8px;"></div>
            <div style="margin-bottom: 16px;"><label style="font-weight:600;">Época de plantio</label><input type="text" name="epoca_plantio" style="width:100%; padding:10px 14px; border:2px solid #E0E0E0; border-radius:8px;"></div>
            <div style="margin-bottom: 16px;"><label style="font-weight:600;">Descrição</label><textarea name="descricao" rows="3" style="width:100%; padding:10px 14px; border:2px solid #E0E0E0; border-radius:8px;"></textarea></div>
            <div class="photo-upload-field"><label>Imagem de referência da cultura</label><input type="file" name="imagem_referencia" accept="image/*" class="form-control"></div>
            <button type="submit" class="btn btn-primary" style="width: auto;"><i class="fas fa-save"></i> Guardar</button>
            <a href="{% url 'propriedades:lista_culturas' %}" class="btn btn-outline" style="width: auto;">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
